name: Terraform CI/CD for Production VPC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout P1 repository
        uses: actions/checkout@v4
        with:
          repository: Aurquid/Terraform-vpc-p1
          path: p1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::946509368278:role/GitHubOIDC-TerraformRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        run: |
          cd p1
          terraform init

      - name: Terraform Plan
        run: |
          cd p1
          terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd p1
          terraform apply -auto-approve
