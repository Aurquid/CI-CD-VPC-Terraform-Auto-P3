name: Terraform CI/CD for Production VPC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout P1 repository
        uses: actions/checkout@v4
        with:
          repository: Aurquid/Terraform-vpc-p1
          path: p1
          
      - name: Show GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            )
      
            core.info(`iss: ${payload.iss}`)
            core.info(`aud: ${payload.aud}`)
            core.info(`sub: ${payload.sub}`)
            core.info(`repository: ${payload.repository}`)
            core.info(`ref: ${payload.ref}`)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::946509368278:role/GithubOIDC-TerraformRole
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

 
      - name: Terraform Format Check
        run: |
          cd p1/TFP1
          terraform fmt -check


      - name: Terraform Init
        run: |
          cd p1/TFP1
          terraform init


      - name: Terraform Validate
        run: |
          cd p1/TFP1
          terraform validate

     
      - name: Terraform Plan
        run: |
          cd p1/TFP1
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd p1/TFP1
          terraform apply -auto-approve tfplan
      - name: Terraform Destroy
        if: github.ref == 'refs/heads/main'
        run: |
          cd p1/TFP1
          terraform destroy -auto-approve
      
